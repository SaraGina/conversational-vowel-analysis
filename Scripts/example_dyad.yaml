# Example dyad config - copy this file, rename it, and edit.

# Language of the recordings: en (English), da (Danish) or ja (Japanese).
# Leave it out and English is used. A language without a pronunciation
# dictionary in Input/ still runs, but the words are then searched exactly as
# written, without recovering the spellings the recogniser may invent.
language: en

speaker_A:
  audio: speakerA.wav               # place the file in Input/
  transcript: speakerA_fw.json      # optional; transcribed automatically if absent
  label: Confederate
  max_formant: 5000                 # ~5000 lower voices, ~5500 higher voices
speaker_B:
  audio: speakerB.wav
  transcript: speakerB_fw.json
  label: Participant
  max_formant: 5500

# The words to search for. Each entry is a name and the two words of the pair.
# A pair whose vowels need a different analysis band can carry its own formant
# ceiling, written in the longer form below; without one, the speaker's value
# above is used. Praat looks for the same five formants inside whatever band it
# is given, so lowering the ceiling changes the model and not only the range.
# The ceiling used is written beside every measurement in the output.
pairs:
  sheep_ship:  [sheep, ship]
  meal_mill:   [meal, mill]
  pool_pull:
    words: [pool, pull]
    max_formant: 4000

segment_gap: 45          # gap (s) between two tokens of the SAME pair
                         # that starts a new discussion segment for it

# Optional: measure words that are already located, instead of searching for
# them. With this line the first three stages are skipped: no transcription,
# no word search, no speaker assignment - so one recording is enough and
# speaker_B can be left out. The Excel needs a word column and an onset
# column; an end column is used where it is there.
# annotations: my_annotation.xlsx

# Optional: an existing manual annotation to compare against, in Output/.
# Omit the line to skip the comparison.
# human_excel: manual_annotation.xlsx

# Optional: analyze only part of the recording (seconds). Useful to exclude
# a warm-up period that annotators also exclude. 0 = no limit.
analysis_start: 0
analysis_end: 0
